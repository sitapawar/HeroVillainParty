<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heroes vs Villains</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;0,900;1,700&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  /* ====== SETTINGS YOU MIGHT TWEAK ====== */
  :root{
    --ink:#0a0708;
    --panel:#120c0d;
    --line:rgba(255,235,225,.09);
    --bone:#efe6d8;       /* Heroes */
    --blood:#d4142a;      /* Villains */
    --blood-deep:#6e0a15;
    --muted:#8d817c;
    --serif:'Playfair Display', Georgia, serif;
    --sans:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);color:var(--bone);overflow:hidden}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(120vw 70vh at 50% 115%, rgba(212,20,42,.22), transparent 60%),
      radial-gradient(60vw 50vh at 100% 0%, rgba(110,10,21,.18), transparent 70%),
      var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  body.idle{cursor:none}

  .stage{
    height:100vh;width:100vw;
    display:grid;
    grid-template-rows:auto auto 1fr;
    gap:3.2vh;
    padding:4vh 4.5vw 4.5vh;
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:2vh}
  .kicker{font-size:1.25vh;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:.9vh}
  h1{font-family:var(--serif);font-weight:900;font-size:5.6vh;line-height:1;letter-spacing:.01em}
  h1 em{font-style:italic;font-weight:700;color:var(--blood);font-size:.62em;margin:0 .35em;position:relative;top:-.12em}
  .status{display:flex;align-items:center;gap:.8vw;font-size:1.3vh;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .dot{width:1vh;height:1vh;border-radius:50%;background:var(--blood);box-shadow:0 0 1.4vh var(--blood);animation:pulse 2.4s ease-in-out infinite}
  .status.err .dot{background:#555;box-shadow:none;animation:none}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- scores ---------- */
  .scores{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:3vw}
  .team{display:flex;flex-direction:column}
  .team.villain{align-items:flex-end;text-align:right}
  .team .label{font-size:1.6vh;letter-spacing:.55em;text-transform:uppercase;font-weight:800;margin-bottom:.4vh}
  .team.hero .label{color:var(--bone)}
  .team.villain .label{color:var(--blood)}
  .num{font-family:var(--serif);font-weight:900;font-size:14vh;line-height:.85;font-variant-numeric:lining-nums tabular-nums;transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
  .team.villain .num{color:var(--blood);text-shadow:0 0 6vh rgba(212,20,42,.35)}
  .num.bump{transform:scale(1.08)}
  .vs{font-family:var(--serif);font-style:italic;font-weight:700;font-size:4.5vh;color:var(--muted);padding-bottom:4vh}

  .tug{grid-column:1/-1;margin-top:1.6vh}
  .bar{position:relative;height:1.3vh;border-radius:99px;overflow:hidden;background:var(--blood);box-shadow:0 0 3vh rgba(212,20,42,.25)}
  .bar .h{position:absolute;inset:0 auto 0 0;width:50%;background:var(--bone);transition:width 1.2s cubic-bezier(.6,0,.2,1)}
  .marker{position:absolute;top:50%;left:50%;width:.45vh;height:3.6vh;background:var(--ink);transform:translate(-50%,-50%);transition:left 1.2s cubic-bezier(.6,0,.2,1)}
  .barwrap{position:relative}
  .lead{margin-top:1.4vh;text-align:center;font-size:1.5vh;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lead b{color:var(--bone);font-weight:800}
  .lead b.v{color:var(--blood)}

  /* ---------- bottom ---------- */
  .lower{display:grid;grid-template-columns:1.75fr 1fr;gap:3vw;min-height:0}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid var(--line);border-radius:1.4vh;padding:2.6vh 2vw;min-height:0;display:flex;flex-direction:column}
  .card h2{font-size:1.3vh;letter-spacing:.45em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1.6vh;display:flex;justify-content:space-between}

  .feed{list-style:none;flex:1;min-height:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(#000 75%,transparent);mask-image:linear-gradient(#000 75%,transparent)}
  .feed li{display:grid;grid-template-columns:.35vw 1fr auto;gap:1.4vw;align-items:center;padding:1.5vh 0;border-bottom:1px solid var(--line)}
  .feed li .stripe{align-self:stretch;border-radius:9px;background:var(--bone)}
  .feed li.v .stripe{background:var(--blood)}
  .feed .what{font-family:var(--serif);font-weight:700;font-size:2.7vh;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed .meta{font-size:1.45vh;color:var(--muted);margin-top:.5vh;letter-spacing:.02em}
  .feed .meta .who{color:var(--bone);font-weight:600}
  .feed li.v .meta .who{color:#f0596a}
  .feed .pts{font-family:var(--serif);font-weight:900;font-size:3.6vh;font-variant-numeric:lining-nums}
  .feed li.v .pts{color:var(--blood)}
  .feed li.new{animation:enter .9s cubic-bezier(.2,.9,.3,1)}
  .feed li.new .what{animation:glow 2.6s ease-out}
  @keyframes enter{from{opacity:0;transform:translateY(-2vh)}}
  @keyframes glow{0%{text-shadow:0 0 3vh rgba(212,20,42,.9)}100%{text-shadow:none}}
  .empty{color:var(--muted);font-family:var(--serif);font-style:italic;font-size:2.4vh;padding-top:2vh}

  .side{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:2.4vh;min-height:0}
  .side .card:first-child{overflow:hidden}
  .board{list-style:none;counter-reset:r}
  .board li{display:flex;align-items:center;gap:1vw;padding:.85vh 0;border-bottom:1px solid var(--line);counter-increment:r}
  .board li::before{content:counter(r);font-family:var(--serif);font-weight:800;font-size:2.2vh;color:var(--muted);width:1.6vw}
  .board li:first-child::before{color:var(--blood)}
  .board .nm{flex:1;font-weight:600;font-size:2.1vh;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .tm{font-size:1.15vh;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-left:.6vw;font-weight:600}
  .board .tm.v{color:var(--blood)}
  .board .sc{font-family:var(--serif);font-weight:900;font-size:2.5vh;font-variant-numeric:lining-nums tabular-nums}

  .join{flex-direction:row;justify-content:space-around;align-items:flex-start;gap:1.6vw;padding:1.8vh 1.6vw}
  .join .qi{display:flex;flex-direction:column;align-items:center;text-align:center}
  .qr{background:var(--bone);padding:1vh;border-radius:.8vh;width:11.5vh;height:11.5vh;flex:none;margin-bottom:1vh}
  .qr svg{width:100%;height:100%;display:block}
  .join .t1{font-family:var(--serif);font-weight:800;font-size:2.4vh;line-height:1.1}
  .join .t1 span{color:var(--blood)}
  .join .t2{font-size:1.25vh;color:var(--muted);margin-top:.6vh;letter-spacing:.04em}

  /* ---------- big "points landed" flash ---------- */
  .flash{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;z-index:10;
    background:radial-gradient(closest-side,rgba(10,7,8,.85),rgba(10,7,8,.4) 70%,transparent)}
  .flash.show{animation:flash 2.6s ease-out}
  .flash .in{text-align:center}
  .flash .p{font-family:var(--serif);font-weight:900;font-size:22vh;line-height:.9}
  .flash .w{font-size:2.4vh;letter-spacing:.6em;text-transform:uppercase;font-weight:800;margin-top:1vh}
  .flash.v .p,.flash.v .w{color:var(--blood);text-shadow:0 0 8vh rgba(212,20,42,.6)}
  @keyframes flash{0%{opacity:0;transform:scale(.96)}12%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>

  <header>
    <div>
      <div class="kicker">Zwomita's Halloween</div>
      <h1>Heroes<em>vs</em>Villains</h1>

  ];
  const extra = Math.floor((Date.now()/1000/REFRESH_SECONDS)) % 4; // simulate new entries
  for(let i=0;i<extra;i++) rows.push([`10/17/2026 21:0${i}:00`, i%2?'Hero':'Villain', i%2?'Defended the snack table':'Swapped the playlist to sea shanties', 3+i, 'host', i%2?'Priya':'Dev']);
  return {cols, rows};
}

/* ====== PARSING ====== */
function idx(cols, ...keys){
  const l = cols.map(c=>String(c).toLowerCase());
  for(const k of keys){ const i = l.findIndex(c=>c.includes(k)); if(i>-1) return i; }
  return -1;
}
function parseTime(s){
  if(!s) return 0;
  const m = String(s).match(/(\d+)\/(\d+)\/(\d+)[ T]+(\d+):(\d+):?(\d+)?/);
  if(m) return new Date(+m[3], +m[1]-1, +m[2], +m[4], +m[5], +(m[6]||0)).getTime();
  const d = Date.parse(s); return isNaN(d) ? 0 : d;
}
function niceName(n){ return n.trim().replace(/\s+/g,' ').replace(/\b\p{L}/gu, c=>c.toUpperCase()); }

function normalise({cols, rows}){
  const iT=idx(cols,'timestamp'), iTeam=idx(cols,'hero or villain','team'), iWhat=idx(cols,'achievement','deed'),
        iPts=idx(cols,'points'), iWit=idx(cols,'witness'), iName=idx(cols,'name');
  const out=[];
  rows.forEach((r,n)=>{
    const team = String(r[iTeam]??'').toLowerCase();
    const side = team.includes('villain') ? 'v' : team.includes('hero') ? 'h' : null;
    let pts = parseFloat(String(r[iPts]??'').replace(/[^\d.\-]/g,''));
    if(!side || !isFinite(pts) || pts < 1) return;
    pts = Math.min(10, Math.round(pts));
    out.push({
      key: `${r[iT]}|${n}`,
      t: parseTime(r[iT]), side, pts,
      what: String(r[iWhat]??'').trim() || 'A deed most mysterious',
      witness: String(r[iWit]??'').trim(),
      name: String(r[iName]??'').trim(),
    });
  });
  out.sort((a,b)=>a.t-b.t);
  return out;
}

/* ====== RENDER ====== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seen = null, lastH = 0, lastV = 0;

function animateNum(el, from, to){
  if(from===to){ el.textContent=to; return; }
  const start=performance.now(), dur=900;
  (function step(now){
    const k=Math.min(1,(now-start)/dur), e=1-Math.pow(1-k,3);
    el.textContent=Math.round(from+(to-from)*e);
    if(k<1) requestAnimationFrame(step);
  })(start);
  el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),400);
}

function fmtTime(t){ return t ? new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : ''; }

function render(entries){
  const H = entries.filter(e=>e.side==='h').reduce((s,e)=>s+e.pts,0);
  const V = entries.filter(e=>e.side==='v').reduce((s,e)=>s+e.pts,0);
  animateNum($('hNum'), lastH, H); animateNum($('vNum'), lastV, V);
  lastH=H; lastV=V;

  const share = (H+V) ? H/(H+V)*100 : 50;
  $('hBar').style.width = share+'%';
  $('marker').style.left = share+'%';
  const diff = Math.abs(H-V);
  $('lead').innerHTML = !(H+V) ? 'The battle begins'
    : H===V ? 'Dead even'
    : H>V ? `<b>Heroes</b> lead by ${diff}` : `<b class="v">Villains</b> lead by ${diff}`;

  // feed
  const newKeys = seen ? entries.filter(e=>!seen.has(e.key)) : [];
  const latest = entries.slice(-FEED_LENGTH).reverse();
  $('count').textContent = entries.length ? `${entries.length} deed${entries.length>1?'s':''}` : '';
  $('feed').innerHTML = latest.length ? latest.map(e=>{
    const who = e.name ? niceName(e.name) : `A mysterious ${e.side==='v'?'Villain':'Hero'}`;
    const wit = e.witness ? ` · witnessed by ${esc(e.witness)}` : '';
    const isNew = newKeys.includes(e);
    return `<li class="${e.side==='v'?'v':''}${isNew?' new':''}">
      <span class="stripe"></span>
      <div><div class="what">${esc(e.what)}</div>
      <div class="meta"><span class="who">${esc(who)}</span>${wit}${e.t?' · '+fmtTime(e.t):''}</div></div>
      <div class="pts">+${e.pts}</div></li>`;
  }).join('') : `<div class="empty">No deeds yet. Who dares go first?</div>`;

  // leaderboard (named players only, case-insensitive)
  const people = new Map();
  for(const e of entries){
    if(!e.name) continue;
    const k = e.name.toLowerCase().replace(/\s+/g,' ').trim();
    const p = people.get(k) || {name:niceName(e.name), pts:0, side:e.side, first:e.t};
    p.pts += e.pts; p.side = e.side; people.set(k,p);
  }
  const top = [...people.values()].sort((a,b)=>b.pts-a.pts || a.first-b.first).slice(0,BOARD_LENGTH);
  $('board').innerHTML = top.length ? top.map(p=>`<li><span class="nm">${esc(p.name)}<span class="tm ${p.side==='v'?'v':''}">${p.side==='v'?'Villain':'Hero'}</span></span><span class="sc">${p.pts}</span></li>`).join('')
    : `<div class="empty">Glory awaits.</div>`;

  // big flash for the newest new entry
  if(newKeys.length){
    const n = newKeys[newKeys.length-1];
    const f=$('flash');
    $('flashP').textContent = '+' + newKeys.filter(e=>e.side===n.side).reduce((s,e)=>s+e.pts,0);
    $('flashW').textContent = n.side==='v' ? 'Villains' : 'Heroes';
    f.className = 'flash' + (n.side==='v'?' v':'');
    void f.offsetWidth; f.classList.add('show');
  }
  seen = new Set(entries.map(e=>e.key));
}

/* ====== LOOP ====== */
let lastOk = 0;
async function tick(){
  try{
    let data;
    if(DEMO) data = demoData();
    else { try{ data = await loadJsonp(); } catch(e){ data = await loadCsv(); } }
    render(normalise(data));
    lastOk = Date.now();
    $('status').classList.remove('err');
  }catch(err){
    console.warn('Load failed:', err);
    $('status').classList.add('err');
  }
  updateStatus();
}
function updateStatus(){
  if(!lastOk){ $('statusText').textContent = $('status').classList.contains('err') ? 'Reconnecting…' : 'Connecting…'; return; }
  const s = Math.round((Date.now()-lastOk)/1000);
  $('statusText').textContent = $('status').classList.contains('err') ? 'Reconnecting…' : (DEMO ? 'Demo · ' : 'Live · ') + (s<5 ? 'just now' : s+'s ago');
}
tick(); setInterval(tick, REFRESH_SECONDS*1000); setInterval(updateStatus, 1000);

/* ====== "GET A TASK" QR — points at tasks.html next to this page, wherever it's hosted ====== */
(function(){
  const url = new URL('tasks.html', location.href).href.split('?')[0];
  function draw(){
    if(!window.qrcode){ return; }
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    const n = q.getModuleCount(); let d = '';
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c},${r}h1v1h-1z`;
    $('taskQr').innerHTML = `<svg viewBox="0 0 ${n} ${n}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges"><path d="${d}" fill="#0a0708"/></svg>`;
  }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
  s.onload = draw; document.head.appendChild(s);
})();

/* ====== PROJECTOR NICETIES ====== */
// Click or press F for fullscreen
function fs(){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{}); else document.exitFullscreen?.(); }
document.addEventListener('dblclick', fs);
document.addEventListener('keydown', e=>{ if(e.key==='f'||e.key==='F') fs(); });
// Keep the screen awake
let lock=null;
async function wake(){ try{ lock = await navigator.wakeLock?.request('screen'); }catch(e){} }
wake(); document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') wake(); });
// Hide the cursor when idle
let idleT; document.addEventListener('mousemove', ()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),2500); });
</script>
